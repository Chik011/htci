<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk | HTCI</title>
    <link rel="icon" type="image/png" href="img/sgllogo.png" />
    <link rel="stylesheet" href="styles.css?v=20261021" />
  </head>
  <body class="auth-page">
    <main class="auth-layout">
      <section class="auth-intro">
        <a class="brand" href="index.html"><b>HT</b> HTCI</a>
        <div class="intro-copy">
          <h1>Monitoring<br /><em>data pembakaran</em></h1>
        </div>
      </section>
      <section class="auth-panel">
        <div class="auth-form-wrap">
          <p class="eyebrow">SELAMAT DATANG KEMBALI</p>
          <h2>Masuk ke HTCI</h2>
          <p class="form-description">Sudah punya akun?</p>
          <form data-auth-form="login">
            <label for="email">Username/Gmail</label
            ><input
              id="email"
              type="email"
              placeholder="Username/Gmail"
              required
            /><label for="password">Kata sandi</label
            ><input
              id="password"
              type="password"
              placeholder="Masukkan kata sandi"
              required
            />
            <div class="form-options">
              <label class="checkbox-label"
                ><input type="checkbox" /> Ingat saya</label
              ><a href="#">Lupa kata sandi?</a>
            </div>
            <button class="primary auth-submit" type="submit">
              Login <span>→</span>
            </button>
          </form>
          <p class="auth-switch">
            Sudah punya akun? <a href="register.html">Daftar sekarang</a>
          </p>
        </div>
        <small class="auth-footer"
          >© 2026 HTCI · Sistem monitoring Pembakaran</small
        >
      </section>
    </main>
    <div class="toast" id="toast"></div>
    <script src="app.js?v=20261021"></script>
  </body>
</html>
